<style>
  html, body { margin: 0; height: 100%; background: #0a1110; overflow: hidden; }
  #course { position: fixed; left: 0; top: env(safe-area-inset-top); display: block; width: 100%; height: calc(100dvh - 66px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); border: 0; background: #0a1110; }

<body>
<!-- The Learn screen of the installed flutterdev.in app: shows the DartIsCool course inside the app, so it never opens in a
     separate browser sheet. Opened in a normal browser tab, it simply goes to the course's own address. -->
<div class="loading">Opening DartIsCool…</div>
<script>
(function () {
  var COURSE = 'https://dartiscool.flutterdev.in/';
  var to = new URLSearchParams(location.search).get('to') || '';
  var target = COURSE + to.replace(/^\/+/, '');
  if (!(matchMedia('(display-mode: standalone)').matches || navigator.standalone === true)) { location.replace(target); return; }
  var f = document.createElement('iframe');
  f.id = 'course'; f.title = 'DartIsCool course'; f.src = target; f.allow = 'clipboard-write; fullscreen';
  document.body.appendChild(f);
})();
</script>

</body>
